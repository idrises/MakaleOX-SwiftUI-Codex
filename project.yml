name: MakaleSwiftUI
options:
  minimumXcodeGenVersion: 2.38.0
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 5.0
    MACOSX_DEPLOYMENT_TARGET: 13.0
    SUPPORTS_MACCATALYST: NO
targets:
  MakaleSwiftUI:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: MakaleSwiftUI
        excludes:
          - Resources/Info.plist
          - Resources/Info-iOS.plist
          - SQLClient/libfreetds.a
          - SQLClient/libfreetds-arm64-repacked.a
          - SQLClient/libfreetds-iossim-arm64-repacked.a
          - SQLClient/libfreetds-prebuilt-x86_64-legacy.a
          - SQLClient/libfreetds-universal-legacy.a
          - SQLClient/libfreetds.a
          - SQLClient/libfreetds-arm64-repacked.a
          - SQLClient/libfreetds-iossim-arm64-repacked.a
          - SQLClient/libfreetds-prebuilt-x86_64-legacy.a
          - SQLClient/libfreetds-universal-legacy.a
    dependencies:
      - sdk: AVKit.framework
      - sdk: PDFKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codex.MakaleSwiftUI
        PRODUCT_NAME: MedLib
        INFOPLIST_FILE: MakaleSwiftUI/Resources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: MakaleSwiftUI/App/MakaleSwiftUI-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/MakaleSwiftUI/SQLClient
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/MakaleSwiftUI/SQLClient
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
        OTHER_LDFLAGS:
          - $(inherited)
          - $(SRCROOT)/MakaleSwiftUI/SQLClient/libfreetds-arm64-repacked.a
          - -liconv
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MakaleSwiftUI-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MakaleSwiftUI
        excludes:
          - Resources/Info.plist
          - Resources/Info-iOS.plist
    dependencies:
      - sdk: AVKit.framework
      - sdk: PDFKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codex.MakaleSwiftUI.iOS-2
        PRODUCT_NAME: MedLibKlinik
        APP_DISPLAY_NAME: MedLib
        APP_BRAND_TITLE: MedLib Clinic
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: T76DN37KU3
        CODE_SIGN_IDENTITY: Apple Development
        PROVISIONING_PROFILE_SPECIFIER: MedLib Clinic
        INFOPLIST_FILE: MakaleSwiftUI/Resources/Info-iOS.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: MakaleSwiftUI/App/MakaleSwiftUI-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/MakaleSwiftUI/SQLClient
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/MakaleSwiftUI/SQLClient
        OTHER_LDFLAGS:
          - $(inherited)
          - $(SRCROOT)/MakaleSwiftUI/SQLClient/libfreetds-iossim-arm64-repacked.a
          - -liconv
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MakaleSwiftUI-iOS-2:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MakaleSwiftUI
        excludes:
          - Resources/Info.plist
          - Resources/Info-iOS.plist
    dependencies:
      - sdk: AVKit.framework
      - sdk: PDFKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codex.MakaleSwiftUI.iOS-2
        PRODUCT_NAME: MedLibAkademi
        APP_DISPLAY_NAME: MedLib
        APP_BRAND_TITLE: MedLib Academy
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: T76DN37KU3
        CODE_SIGN_IDENTITY: Apple Development
        PROVISIONING_PROFILE_SPECIFIER: MedLib Clinic
        INFOPLIST_FILE: MakaleSwiftUI/Resources/Info-iOS.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: MakaleSwiftUI/App/MakaleSwiftUI-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/MakaleSwiftUI/SQLClient
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/MakaleSwiftUI/SQLClient
        OTHER_LDFLAGS:
          - $(inherited)
          - $(SRCROOT)/MakaleSwiftUI/SQLClient/libfreetds-iossim-arm64-repacked.a
          - -liconv
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
